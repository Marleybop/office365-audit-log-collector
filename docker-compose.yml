version: '3.8'

services:
  office365-collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: office365-audit-collector:latest
    container_name: office365-collector
    restart: unless-stopped

    volumes:
      # Mount your config file
      - ./config.yaml:/app/config.yaml:ro

      # Persistent storage for deduplication files
      - ./data:/app/data

    # Optional: Override entrypoint for debugging
    # command: ["--config", "/app/config.yaml"]

    # Optional: If using Azure Log Analytics
    # command: ["--config", "/app/config.yaml", "--oms-key", "YOUR_OMS_KEY"]

    # Optional: For interactive mode
    # stdin_open: true
    # tty: true
    # command: ["--config", "/app/config.yaml", "--interactive"]

    networks:
      - logging

    # Optional: Connect to Graylog/Fluentd if running in same compose
    # depends_on:
    #   - graylog

networks:
  logging:
    driver: bridge

